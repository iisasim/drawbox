<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="..\images\isda_noboarder.png">
    <title>Piirtoalusta</title>
    <!--generic drawbox styling -->
    <link href="drawbox.css" rel="stylesheet" type="text/css" media="all">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
</head>
<body>
 <div class="flex tutorial">
  <div class="drawbox_con left">
    
    <!-- Ohjetekstit ja "back to home" poistettu täältä -->

    <div class="TheCanvas">
    <canvas id="drawboxcanvas" width="500px" height="500px"></canvas>
    <br>
    <fieldset id="controls">
            <label for="colorpicker"><strong>Värivalitsin: </strong></label>
            <input type="color" name="colorpicker" id="colorpicker" oninput="stroke_color = this.value; colorchoice.value = this.value"> 
            <output name="colorchoice" id="colorchoice" for="colorpicker">musta</output><br><br>
      
  <label><strong>Väripaletti:</strong></label>
  <select name="palette" id="palette" onchange="showDiv()">
    <option value="Basic">Perusvärit</option>
    <option value="Pink">Vaaleanpunainen</option>
    <option value="AutumnHarvest">Syyssävyt</option>
  </select>

  <div id="Basic" class="colorPalette">
    <div onclick="change_color(this); colorchoice.value = 'Punainen' ; colorpicker.value = '#ff0000'" style="background: #ff0000;" class="stroke_color"></div>
    <div onclick="change_color(this); colorchoice.value = 'Sininen' ; colorpicker.value = '#0000ff'" style="background: #0000ff;" class="stroke_color"></div>
    <div onclick="change_color(this); colorchoice.value = 'Keltainen' ; colorpicker.value = '#ffff00'" style="background: #ffff00" class="stroke_color"></div>
    <div onclick="change_color(this); colorchoice.value = 'Vihreä' ; colorpicker.value = '#00ff00'" style="background: #00ff00" class="stroke_color"></div>
    <div onclick="change_color(this); colorchoice.value = 'Turkoosi' ; colorpicker.value = '#00ffff'" style="background: #00ffff" class="stroke_color"></div>
    <div onclick="change_color(this); colorchoice.value = 'Magenta' ; colorpicker.value = '#ff00ff'" style="background: #ff00ff" class="stroke_color"></div>
    <div onclick="change_color(this); colorchoice.value = 'Musta' ; colorpicker.value = '#000000'" style="background: #000000" class="stroke_color"></div>
  </div>

    <div id="Pink" class="colorPalette">
        <div onclick="change_color(this); colorchoice.value = 'Hennon vaalea' ; colorpicker.value = '#FFE5EC'" style="background: #FFE5EC;" class="stroke_color"></div>
        <div onclick="change_color(this); colorchoice.value = 'Pastelliroosa' ; colorpicker.value = '#FFC2D1'" style="background: #FFC2D1;" class="stroke_color"></div>
        <div onclick="change_color(this); colorchoice.value = 'Kirsikankukka' ; colorpicker.value = '#FFB3C6'" style="background: #FFB3C6;" class="stroke_color"></div>
        <div onclick="change_color(this); colorchoice.value = 'Pumpulivaalea' ; colorpicker.value = '#ff8fab'" style="background: #ff8fab;" class="stroke_color"></div>
        <div onclick="change_color(this); colorchoice.value = 'Terävä pinkki' ; colorpicker.value = '#fb6f92'" style="background: #fb6f92;" class="stroke_color"></div>     
   </div>
     
    <div id="AutumnHarvest" class="colorPalette">
        <div onclick="change_color(this); colorchoice.value = 'Tumma viini' ; colorpicker.value = '#6f1d1b'" style="background: #6f1d1b;" class="stroke_color"></div>
        <div onclick="change_color(this); colorchoice.value = 'Kamelinruskea' ; colorpicker.value = '#BB9457'" style="background: #BB9457;" class="stroke_color"></div>
        <div onclick="change_color(this); colorchoice.value = 'Kahvinruskea' ; colorpicker.value = '#432818'" style="background: #432818;" class="stroke_color"></div>
        <div onclick="change_color(this); colorchoice.value = 'Suklaa' ; colorpicker.value = '#99582a'" style="background: #99582a;" class="stroke_color"></div>
        <div onclick="change_color(this); colorchoice.value = 'Aprikoosi' ; colorpicker.value = '#ffe6a7'" style="background: #ffe6a7;" class="stroke_color"></div>     
   </div>
   
            <label for="StrokeAmount"><strong>Siveltimen koko: </strong></label>
            <input type="range" id="Strokewidth" name="Strokewidth" min="1" max="100" value="2" oninput="stroke_width = this.value; StrokeAmount.value=this.value" title="siveltimen paksuus">
            <output name="StrokeAmount" id="StrokeAmount" for="Stokewidth">2</output>
        <br><br>
            <label for="OpacityAmount"><strong>Läpinäkyvyys: </strong></label>
            <input type="range" id="Opacity" name="Opacity" step="0.05" min="0" max="1" value="1" oninput="line_opacity = this.value; OpacityAmount.value=this.value" title="läpinäkyvyys">
            <output name="OpacityAmount" id="OpacityAmount" for="Opacity">1.00</output>
        <br><br>
            <label for="BrushType"><strong>Sivellintyyppi:</strong></label>
                <select id="BrushType" name="BrushType" oninput="stroke_join = this.value">
                    <option value="round" selected>Pyöreä</option>
                    <option value="bevel">Viistetty</option>
                    <option value="miter">Terävä</option>
                </select>
          <span> | </span>
            <label for="LineCap"><strong>Viivan päädyt:</strong></label>
                <select id="LineCap" name="LineCap" oninput="line_cap = this.value">
                    <option value="round" selected>Pyöreä</option>
                    <option value="butt">Suora</option>
                    <option value="square">Neliö</option>
                </select>
        <br><br>
            <label for="Name"><strong>Nimesi:</strong></label>
            <input type="text" oninput="user_name = this.value" required maxlength="30" placeholder="Kirjoita nimesi">
        <br>
        <br>
</fieldset>    
    <button onclick="Undo()" title="voit käyttää myös komentoa ctrl+z">Kumoa</button>
    <button onclick="Clear()" title="tyhjennä alusta">Tyhjennä</button>
    <button id="submit">Lähetä piirustus</button>

    <p id="status"></p>
    </div>

    <!-- "Draw me a picture" ja "create your own" poistettu täältä -->

    </div>
    <div class="guide right">
</div>
</div>
   
    <hr>
    <h2>Lähetetyt piirustukset ☻</h2>
    <hr>
    <div id="gallery">Ladataan kuvia...</div>
    <hr>
    <br>
    <script src="drawbox.js"></script>
   
</body>
</html>
