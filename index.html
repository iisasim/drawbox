<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawbox - Galleria</title>
    <link rel="stylesheet" href="drawbox.css">
    <style>
        body {
            font-family: Verdana, sans-serif;
            background: #fdfdfd;
            padding: 20px;
            text-align: center;
        }
        .top-bar {
            margin-bottom: 20px;
        }
        /* Tyylikäs nappi millä pääsee piirtämään */
        .draw-btn {
            display: inline-block;
            padding: 10px 20px;
            background: var(--accentPink, #d63384);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .draw-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <h1>Drawbox Galleria</h1>
    
    <div class="top-bar">
        <!-- Nappi josta pääsee toiselle välilehdelle piirtämään -->
        <a href="draw.html" class="draw-btn">🎨 Piirrä oma kuva!</a>
    </div>

    <!-- Tänne skripti hakee automaattisesti piirretyt kuvat Google Sheetsistä -->
    <div class="box">
        <div class="title">gallerian luomukset</div>
        <div id="gallery">Ladataan kuvia...</div>
    </div>

    <!-- Sama tuttu skripti hoitaa kuvien haun -->
    <script src="drawbox.js"></script>
</body>
</html>
